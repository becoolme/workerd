name: VRT sync upstream

# Keeps the fork in step with cloudflare/workerd without letting upstream rewrites touch the
# patched branch by surprise. `vrt` is our patches plus the upstream tree; there is no mirror
# branch, because a `main` mirror push would always carry `.github/workflows/*` changes and a
# GITHUB_TOKEN push is refused without `workflows` permission.
#
# Each run:
#   1. if `vrt` already contains upstream, stops;
#   2. otherwise merges `upstream/main` into `sync/upstream-<date>`:
#        - `.github/workflows/**` and `.github/actions/**` stay exactly as they are on `vrt`
#          (`.gitattributes` merges them `ours`, and the merge restores the trees afterwards),
#          so the push never needs `workflows` permission;
#        - clean merge -> push the branch, open a PR into `vrt`, dispatch the build;
#        - conflict    -> an include-only conflict is auto-resolved and the merge retried; any
#                         other conflict pushes a branch holding upstream's tree so GitHub shows
#                         the conflicting PR, comments the conflicted files, and labels it for a
#                         maintainer.

on:
  schedule:
    # Upstream releases several times a day; weekly is enough to keep the diff small without
    # spending runner minutes on churn. Run it manually after an important upstream fix.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: vrt-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The checkout has an `upstream` remote too; without this gh resolves the repository
      # from that remote and tries to create labels on cloudflare/workerd.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout vrt
        uses: actions/checkout@v7
        with:
          ref: vrt
          fetch-depth: 0
          show-progress: false

      - name: Configure git
        run: |
          git config user.name "vrt-sync-bot"
          git config user.email "vrt-sync-bot@users.noreply.github.com"
          # `.gitattributes` keeps `.github/workflows/**` and `.github/actions/**` ours; the
          # driver has to be configured or git refuses to merge those paths.
          git config merge.ours.driver true

      # A PR authored by `github-actions[bot]` is treated as untrusted: GitHub parks its
      # `pull_request` run in `action_required` until a maintainer approves it, every week.
      # Opening the PR with a user token avoids that, and lets the normal `pull_request` build
      # run without our extra dispatch.
      - name: Check for a user token
        id: auth
        env:
          SYNC_TOKEN: ${{ secrets.VRT_SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VRT_SYNC_TOKEN is not set; the sync PR will be opened by github-actions[bot] and need manual run approval."
          fi

      - name: Fetch upstream
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cloudflare/workerd 2>/dev/null || true
          git fetch --no-tags upstream main
          echo "sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Check whether vrt is behind
        id: behind
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main origin/vrt; then
            echo "vrt already contains upstream/main; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "behind=$(git rev-list --count origin/vrt..upstream/main)" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        id: merge
        if: steps.behind.outputs.needed == 'true'
        run: |
          set -euo pipefail
          branch="sync/upstream-$(date -u +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch" origin/vrt
          if ! git merge --no-edit --no-ff upstream/main; then
            # Both sides regularly add an #include at the same anchor; accept both and retry.
            # Anything else is a real conflict: fall through to the conflict PR, never push
            # conflict markers.
            if git diff --name-only --diff-filter=U \
                | xargs -r python3 .vrt/resolve-includes.py \
                && git add -u \
                && git commit --no-edit; then
              echo "resolved include-only conflicts"
            else
              git merge --abort
              echo "clean=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Our workflows and composite actions never come from upstream. The App token has no
          # `workflows` permission, so any diff there fails the push, and `merge=ours` only
          # covers edits -- upstream additions (e.g. a new pgo-*.yml) still land. Restore the
          # trees exactly as `vrt` has them and drop what upstream added.
          git checkout origin/vrt -- .github/workflows .github/actions
          git diff --cached --name-only --diff-filter=A origin/vrt -- .github/workflows .github/actions \
            | xargs -r git rm -f -q --
          if ! git diff --quiet origin/vrt -- .github/workflows .github/actions; then
            echo "::error::.github/workflows or .github/actions still differs from vrt after restore"
            exit 1
          fi
          # Record which upstream commit this tree carries. Release manifests read it so a
          # binary can be traced to a workerd version without archaeology on the merge commit.
          mkdir -p .vrt
          printf '%s\n' "${{ steps.upstream.outputs.sha }}" > .vrt/upstream
          git add .vrt/upstream
          git commit --amend --no-edit
          echo "clean=true" >> "$GITHUB_OUTPUT"
          git log --oneline -1

      - name: Push clean merge
        if: steps.behind.outputs.needed == 'true' && steps.merge.outputs.clean == 'true'
        run: git push --force origin "${{ steps.merge.outputs.branch }}"

      - name: Open merge PR
        id: pr
        if: steps.behind.outputs.needed == 'true' && steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.VRT_SYNC_TOKEN || github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BEHIND: ${{ steps.behind.outputs.behind }}
        run: |
          set -euo pipefail
          gh label create sync --repo "$GH_REPO" --color 1D76DB --description "Upstream workerd sync" --force >/dev/null
          body=$(cat <<EOF
          Weekly merge of \`cloudflare/workerd@${UPSTREAM_SHA}\` into \`vrt\`.

          - Commits merged: ${BEHIND}
          - Merge commit: $(git rev-parse HEAD)
          - Upstream diff: https://github.com/cloudflare/workerd/compare/main...${UPSTREAM_SHA}

          Opened by the scheduled \`vrt-sync-upstream\` workflow. Merge only after the \`VRT build\`
          check for this PR is green; merging publishes nothing on its own (releases are tagged
          builds, see FORK.md).
          EOF
          )
          if pr=$(gh pr list --repo "$GH_REPO" --base vrt --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -v '^$'); then
            gh pr comment --repo "$GH_REPO" "$pr" --body "Re-ran the sync; branch updated to $(git rev-parse HEAD)."
            echo "number=$pr" >> "$GITHUB_OUTPUT"
          elif url=$(gh pr create --repo "$GH_REPO" --base vrt --head "$BRANCH" \
              --title "chore: sync workerd upstream $(git rev-parse --short=12 "$UPSTREAM_SHA")" \
              --body "$body" --label sync 2>/tmp/pr-error.txt); then
            gh pr comment --repo "$GH_REPO" "$url" --body "Kicking off \`VRT build\` for the merge commit."
            echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          else
            # GITHUB_TOKEN can only open PRs when the organization allows it. The branch is
            # pushed either way, so a human can open the PR with one click.
            echo "::warning::Could not open the sync PR automatically: $(cat /tmp/pr-error.txt)"
            {
              echo "### VRT upstream sync: PR not opened automatically"
              echo
              echo "The branch \`${BRANCH}\` is pushed. Open the PR:"
              echo
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/vrt...${BRANCH}?expand=1"
              echo
              echo "Error: \`$(cat /tmp/pr-error.txt)\`"
              echo
              echo "To automate it, allow GitHub Actions to create pull requests in the org, or"
              echo "add a \`VRT_SYNC_TOKEN\` PAT secret and use it for GH_TOKEN in this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A PR opened with GITHUB_TOKEN does not trigger pull_request workflows (GitHub's
      # recursion guard), so start the build explicitly. Its checks attach to the branch head.
      - name: Dispatch build
        if: steps.pr.outputs.number != '' && steps.auth.outputs.pat != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          # workflow_dispatch is exempt from GitHub's push/PR recursion guard, so the bot can
          # start the build even though its PR did not fire a pull_request event.
          gh workflow run vrt-build.yml --repo "$GH_REPO" --ref "$BRANCH" || {
            echo "::warning::Could not dispatch VRT build; run it from the Actions tab."
          }

      - name: Prepare conflict branch
        if: steps.behind.outputs.needed == 'true' && steps.merge.outputs.clean == 'false'
        run: |
          set -euo pipefail
          branch="${{ steps.merge.outputs.branch }}"
          # The branch holds upstream's tree with our workflows; the PR into vrt renders the
          # conflict. Its push still must not touch .github/workflows/* (no `workflows`
          # permission), so hold those trees at vrt's version in a commit of their own.
          git checkout -B "$branch" upstream/main
          git checkout origin/vrt -- .github/workflows .github/actions
          git diff --cached --name-only --diff-filter=A origin/vrt -- .github/workflows .github/actions \
            | xargs -r git rm -f -q --
          git commit -q -m "chore: hold vrt's workflows and actions in the conflict branch"
          git push --force origin "$branch"

      - name: Collect conflicted files
        id: conflicts
        if: steps.behind.outputs.needed == 'true' && steps.merge.outputs.clean == 'false'
        run: |
          set -euo pipefail
          # --name-only prints "CONFLICT (content): Merge conflict in <path>" style lines plus a
          # machine-readable section; keep only the paths for the PR comment.
          git merge-tree --write-tree --name-only origin/vrt upstream/main \
            | sed -n '/^CONFLICT/p' | sed 's/.*Merge conflict in //' | sort -u > /tmp/conflicts.txt || true
          if [ ! -s /tmp/conflicts.txt ]; then
            echo "(git did not report paths; run the merge locally for details)" > /tmp/conflicts.txt
          fi
          cat /tmp/conflicts.txt

      - name: Open conflict PR
        if: steps.behind.outputs.needed == 'true' && steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.VRT_SYNC_TOKEN || github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          gh label create sync-conflict --repo "$GH_REPO" --color B60205 --description "Upstream sync needs manual conflict resolution" --force >/dev/null
          body=$(cat <<EOF
          Automated merge of \`cloudflare/workerd@${UPSTREAM_SHA}\` into \`vrt\` **conflicts**.

          Conflicted files:

          \`\`\`
          $(cat /tmp/conflicts.txt)
          \`\`\`

          The head branch holds upstream's tree, so GitHub shows the real conflict. Resolve it
          here with the "Resolve conflicts" editor or locally:

          \`\`\`bash
          git fetch origin vrt ${BRANCH}
          git switch -c resolve/${UPSTREAM_SHA:0:12} origin/vrt
          git merge ${BRANCH}       # resolve, then commit
          git push origin HEAD:${BRANCH}
          \`\`\`

          Prefer keeping our patch files (\`vrt-*\`) and taking upstream for everything else,
          then re-check the hooks listed in FORK.md. No build runs until the conflict is gone.

          When you resolve it, also write \`${UPSTREAM_SHA}\` into \`.vrt/upstream\` and commit
          it: release manifests use that file to record the upstream commit and tag.
          EOF
          )
          if pr=$(gh pr list --repo "$GH_REPO" --base vrt --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -v '^$'); then
            gh pr comment --repo "$GH_REPO" "$pr" --body "Sync re-ran; still conflicting."
            echo "number=$pr" >> "$GITHUB_OUTPUT"
          else
            gh pr create --repo "$GH_REPO" --base vrt --head "$BRANCH" \
              --title "chore: sync workerd upstream $(git rev-parse --short=12 "$UPSTREAM_SHA") (conflicts)" \
              --body "$body" --label sync --label sync-conflict
          fi

      - name: Summarize
        run: |
          {
            echo "### VRT upstream sync"
            echo
            echo "- upstream: \`${{ steps.upstream.outputs.sha }}\`"
            echo "- needed: ${{ steps.behind.outputs.needed }}"
            echo "- clean merge: ${{ steps.merge.outputs.clean || 'n/a' }}"
            echo "- branch: \`${{ steps.merge.outputs.branch || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
